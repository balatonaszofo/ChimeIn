&lt;div id=&quot;chime-walkthrough&quot;&gt;
  &lt;style&gt;
    #chime-walkthrough{--page:light-dark(#ffffff,#101719);--ink:light-dark(#19242a,#e4ebed);--quiet:light-dark(#52636c,#a5b6be);--line:light-dark(#dce3e6,#35464e);--soft:light-dark(#f2f5f6,#1a282f);--orange:light-dark(#c43d00,#ff9f75);--panel:light-dark(#edf2e5,#222720);--panel-ink:light-dark(#263321,#f4f0e9);--panel-quiet:light-dark(#56644b,#bac1b2);--reply:light-dark(#ffffff,#30372c);--lime:light-dark(#d0e4ad,#c8ec91);font:14px/1.55 system-ui,sans-serif;color:var(--ink);width:100%;color-scheme:light dark}
    #chime-walkthrough *{box-sizing:border-box}
    #chime-walkthrough button,#chime-walkthrough select,#chime-walkthrough textarea{font:inherit}
    #chime-walkthrough button{border:1px solid var(--line);border-radius:9px;background:var(--page);color:var(--ink);padding:8px 12px}
    #chime-walkthrough button:hover{filter:brightness(.96)}
    #chime-walkthrough button:disabled{opacity:.55}
    #chime-walkthrough [hidden]{display:none!important}
    #chime-walkthrough .demo-top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    #chime-walkthrough .demo-title{display:flex;align-items:center;gap:8px;margin:0;font-size:20px;font-weight:600;letter-spacing:-.5px}
    #chime-walkthrough .sample-tag{font-size:12px;color:var(--quiet)}
    #chime-walkthrough .steps{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:16px;color:var(--quiet);font-size:12px}
    #chime-walkthrough .steps span{display:flex;gap:7px;align-items:center}
    #chime-walkthrough .steps span.active{color:var(--ink);font-weight:600}
    #chime-walkthrough .step-number{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft)}
    #chime-walkthrough .active .step-number{background:var(--ink);color:var(--page)}
    #chime-walkthrough .window{background:var(--page);border:1px solid var(--line);border-radius:14px;overflow:hidden}
    #chime-walkthrough .addressbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--quiet)}
    #chime-walkthrough .address{flex:1;min-width:0;overflow-wrap:anywhere}
    #chime-walkthrough .redditbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
    #chime-walkthrough .reddit-logo{font-size:23px;letter-spacing:-1px;font-weight:700;color:var(--orange)}
    #chime-walkthrough .content{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;padding:24px;align-items:start}
    #chime-walkthrough .post-meta{font-size:12px;color:var(--quiet);margin-bottom:12px}
    #chime-walkthrough .post h2{font-size:24px;font-weight:650;line-height:1.25;letter-spacing:-.6px;margin:0 0 16px}
    #chime-walkthrough .post p{margin:0 0 16px}
    #chime-walkthrough .post-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}
    #chime-walkthrough .votes{background:var(--soft);padding:8px 12px;border-radius:20px;font-size:12px}
    #chime-walkthrough .comment{border-left:2px solid var(--line);padding:0 0 0 14px;margin:22px 0}
    #chime-walkthrough .comment p{margin:5px 0}
    #chime-walkthrough .byline{font-size:12px;color:var(--quiet)}
    #chime-walkthrough .editor-label{display:block;margin:24px 0 8px;font-weight:600}
    #chime-walkthrough textarea{width:100%;resize:vertical;min-height:115px;padding:12px;background:var(--page);color:var(--ink);border:1px solid var(--line);border-radius:10px}
    #chime-walkthrough .editor-tools{display:flex;gap:12px;align-items:center;margin-top:9px;flex-wrap:wrap}
    #chime-walkthrough .editor-note{font-size:12px;color:var(--quiet)}
    #chime-walkthrough .panel-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--quiet);margin-bottom:8px}
    #chime-walkthrough .panel{background:var(--panel);color:var(--panel-ink);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 26px light-dark(#18220d15,#00000030)}
    #chime-walkthrough .panel-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    #chime-walkthrough .brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:-.25px}
    #chime-walkthrough .panel button{background:transparent;border:0;color:var(--panel-ink)}
    #chime-walkthrough .panel .collapse{padding:4px 8px}
    #chime-walkthrough .mode-line{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--panel-quiet)}
    #chime-walkthrough .mode-name{font-weight:600;color:var(--panel-ink)}
    #chime-walkthrough .suggestion{background:var(--reply);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
    #chime-walkthrough .suggestion-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-quiet)}
    #chime-walkthrough .suggestion p{margin:8px 0 12px}
    #chime-walkthrough .panel .copy{background:var(--lime);color:#263321;font-size:12px;font-weight:600;padding:7px 10px;border-radius:7px}
    #chime-walkthrough .panel-footer{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--panel-quiet)}
    #chime-walkthrough .panel-footer button{font-size:12px;padding:3px 6px}
    #chime-walkthrough .load-status{color:var(--panel-quiet);margin:12px 0;font-size:12px}
    #chime-walkthrough .settings label{display:block;font-size:12px;margin:12px 0 6px}
    #chime-walkthrough .settings select{width:100%;padding:10px;background:var(--reply);color:var(--panel-ink);border:1px solid var(--line);border-radius:9px}
    #chime-walkthrough .settings p{font-size:12px;color:var(--panel-quiet);min-height:40px;margin:10px 0}
    #chime-walkthrough .panel .save{background:var(--lime);color:#263321;width:100%;margin-top:4px}
    #chime-walkthrough .demo-tagline{margin:0 0 18px;color:var(--quiet)}
    #chime-walkthrough .celebration{color:var(--panel-ink);font-size:12px;margin:8px 0 14px}
    #chime-walkthrough .caption{margin-top:14px;color:var(--quiet);font-size:12px;min-height:20px}
    @media(max-width:760px){#chime-walkthrough .content{grid-template-columns:1fr;padding:18px;gap:20px}#chime-walkthrough .post h2{font-size:21px}#chime-walkthrough .redditbar{padding:12px 18px}}
    @media(pointer:coarse){#chime-walkthrough button,#chime-walkthrough select{min-height:44px}}
  &lt;/style&gt;
